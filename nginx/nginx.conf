# Prod-verify edge: everything enters here on :8080.
#   /socket.io/ → the TWO ws instances, round-robin (the adapter makes any
#                 instance a valid recipient for any conversation room)
#   /           → the Next standalone server
# WebSocket upgrade headers are REQUIRED or the socket.io handshake 400s.
upstream ws_cluster {
    server ws-1:4001;
    server ws-2:4001;
}

server {
    listen 80;

    location /socket.io/ {
        proxy_pass http://ws_cluster;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # long-lived sockets: don't let nginx time out an idle chat session
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://web:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}