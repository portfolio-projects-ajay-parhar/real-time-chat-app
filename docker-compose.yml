services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: chat
      POSTGRES_DB: chat
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat -d chat"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # --- prod-image topology (docker compose --profile prod-verify up) ---
  # Everything enters through nginx on :8080: /socket.io/ round-robins across
  # the TWO ws instances (Redis adapter fan-out), / goes to the Next standalone
  # server. The one-shot `migrate` service runs `prisma migrate deploy` first.
  migrate:
    profiles: ["prod-verify"]
    build:
      context: .
      dockerfile: web/Dockerfile
      target: migrator
    command: npx prisma migrate deploy --schema web/prisma/schema.prisma
    environment:
      DATABASE_URL: postgresql://chat:chat@postgres:5432/chat?schema=public
    depends_on:
      postgres: { condition: service_healthy }

  ws-1:
    profiles: ["prod-verify"]
    build:
      context: .
      dockerfile: ws/Dockerfile
    environment:
      WS_PORT: "4001"
      DATABASE_URL: postgresql://chat:chat@postgres:5432/chat?schema=public
      REDIS_URL: redis://redis:6379
      ORIGIN: http://localhost:8080
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  ws-2:
    profiles: ["prod-verify"]
    build:
      context: .
      dockerfile: ws/Dockerfile
    environment:
      WS_PORT: "4001"
      DATABASE_URL: postgresql://chat:chat@postgres:5432/chat?schema=public
      REDIS_URL: redis://redis:6379
      ORIGIN: http://localhost:8080
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  web:
    profiles: ["prod-verify"]
    build:
      context: .
      dockerfile: web/Dockerfile
      target: runner
    environment:
      DATABASE_URL: postgresql://chat:chat@postgres:5432/chat?schema=public
      REDIS_URL: redis://redis:6379
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: http://localhost:8080
      WS_INTERNAL_URL: http://nginx
      STORAGE_PROVIDER: local
    volumes:
      - media:/app/.data/uploads
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  nginx:
    profiles: ["prod-verify"]
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - ws-1
      - ws-2

volumes:
  pgdata:
  redisdata:
  media:
